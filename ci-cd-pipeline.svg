<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Automated CI/CD Pipeline &amp; Zero-Downtime Deployment</title>
  <desc id="svg-desc">Pipeline de CI/CD animado con etapas de commit, tests, build y despliegue a cluster de servidores sin tiempo de inactividad.</desc>

  <defs>
    <!-- Clip path para redondear bordes del contenedor y la franja superior -->
    <clipPath id="container-clip">
      <rect x="0" y="0" width="1200" height="300" rx="20" ry="20" />
    </clipPath>
  </defs>

  <style>
    /* Tipografías del sistema */
    .font-mono {
      font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
    }
    .font-sans {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }

    /* Regla obligatoria para transformaciones CSS fluidas */
    .animated-element {
      transform-box: fill-box;
      transform-origin: center;
    }

    /* 1. Viaje del paquete en movimiento (Naranja #F97316) - Ciclo de 8s */
    @keyframes movePayload {
      0% {
        transform: translate(144px, 142px) scale(0);
        opacity: 0;
      }
      4% {
        transform: translate(144px, 142px) scale(1);
        opacity: 1;
      }
      20% {
        transform: translate(394px, 142px) scale(1);
        opacity: 1;
      }
      30% {
        transform: translate(394px, 142px) scale(1.15);
        opacity: 1;
      }
      45% {
        transform: translate(664px, 142px) scale(1);
        opacity: 1;
      }
      55% {
        transform: translate(664px, 142px) scale(1.15);
        opacity: 1;
      }
      72% {
        transform: translate(930px, 172px) scale(1);
        opacity: 1;
      }
      84% {
        transform: translate(945px, 172px) scale(1);
        opacity: 1;
      }
      92% {
        transform: translate(955px, 172px) scale(0);
        opacity: 0;
      }
      100% {
        transform: translate(144px, 142px) scale(0);
        opacity: 0;
      }
    }

    .payload-runner {
      transform-box: fill-box;
      transform-origin: center;
      animation: movePayload 8s cubic-bezier(0.45, 0, 0.25, 1) infinite;
    }

    /* 2. Pulso en el commit */
    @keyframes pulseCommit {
      0%, 100% { transform: scale(1); fill: #0EA5E9; }
      5% { transform: scale(1.3); fill: #F97316; }
      12% { transform: scale(1); fill: #0EA5E9; }
    }
    .commit-dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseCommit 8s ease-in-out infinite;
    }

    /* 3. Activación de los 3 checks de tests */
    @keyframes testCheckOne {
      0%, 16% { fill: #BAE6FD; }
      22%, 85% { fill: #0EA5E9; }
      92%, 100% { fill: #BAE6FD; }
    }
    @keyframes testCheckTwo {
      0%, 22% { fill: #BAE6FD; }
      26%, 85% { fill: #0EA5E9; }
      92%, 100% { fill: #BAE6FD; }
    }
    @keyframes testCheckThree {
      0%, 26% { fill: #BAE6FD; }
      30%, 85% { fill: #0EA5E9; }
      92%, 100% { fill: #BAE6FD; }
    }
    .test-chk-1 { animation: testCheckOne 8s ease-in-out infinite; }
    .test-chk-2 { animation: testCheckTwo 8s ease-in-out infinite; }
    .test-chk-3 { animation: testCheckThree 8s ease-in-out infinite; }

    /* 4. Sellado del build (Aislado en grupo interno para evitar pisar translate) */
    @keyframes buildSeal {
      0%, 42% { transform: scale(1); }
      48%, 56% { transform: scale(1.18); }
      62%, 100% { transform: scale(1); }
    }
    .build-box-inner {
      transform-box: fill-box;
      transform-origin: center;
      animation: buildSeal 8s ease-in-out infinite;
    }

    /* 5. Despliegue de nuevo Pod (Aislado en grupo interno) */
    @keyframes deployReplica {
      0%, 65% {
        opacity: 0.35;
        transform: scale(0.96);
      }
      74%, 88% {
        opacity: 1;
        transform: scale(1);
      }
      94%, 100% {
        opacity: 0.35;
        transform: scale(0.96);
      }
    }
    .replica-inner {
      transform-box: fill-box;
      transform-origin: center;
      animation: deployReplica 8s ease-in-out infinite;
    }

    /* 6. Led del nuevo Pod */
    @keyframes replicaLed {
      0%, 68% { fill: #FDBA74; }
      74%, 88% { fill: #7DD3FC; }
      94%, 100% { fill: #FDBA74; }
    }
    .replica-led {
      animation: replicaLed 8s ease-in-out infinite;
    }

    /* 7. Punto live en header */
    @keyframes liveBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .live-dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: liveBlink 1.8s ease-in-out infinite;
    }
  </style>

  <g clip-path="url(#container-clip)">
    <!-- Fondo principal sólido -->
    <rect x="0" y="0" width="1200" height="300" fill="#E8F6FD" stroke="#0B3A5B" stroke-width="3" rx="20" ry="20" />

    <!-- Franja superior de 10px: Celeste en 900px y Naranja en 300px -->
    <rect x="0" y="0" width="900" height="10" fill="#0EA5E9" />
    <rect x="900" y="0" width="300" height="10" fill="#F97316" />

    <!-- ENCABEZADO: Título (17px) y Subtítulo (14px) legibles a escala 880px -->
    <text x="48" y="44" class="font-mono" font-size="17" font-weight="700" fill="#0B3A5B" letter-spacing="1">AUTOMATED CI/CD PIPELINE</text>
    <text x="48" y="67" class="font-sans" font-size="14" font-weight="600" fill="#0369A1">Commit → Tests → Container Build → Zero-Downtime Rollout</text>

    <!-- Chip de Estado Superior Derecho (Texto #0B3A5B sobre #BAE6FD: Contraste 8.5:1) -->
    <rect x="970" y="26" width="180" height="32" rx="8" fill="#BAE6FD" stroke="#0B3A5B" stroke-width="2.5" />
    <circle cx="990" cy="42" r="6" fill="#F97316" class="live-dot" />
    <text x="1006" y="47" class="font-mono" font-size="13" font-weight="700" fill="#0B3A5B">PIPELINE ACTIVE</text>

    <!-- ==================== RIELES / TRACKS ==================== -->
    <line x1="160" y1="158" x2="940" y2="158" stroke="#BAE6FD" stroke-width="7" stroke-linecap="round" />
    <line x1="160" y1="158" x2="940" y2="158" stroke="#0EA5E9" stroke-width="2.5" stroke-dasharray="8 12" />

    <!-- ==================== ETAPA 1: COMMIT ==================== -->
    <g id="stage-commit">
      <!-- Tarjeta base en celeste suave (cumple paleta estricta) -->
      <circle cx="160" cy="158" r="32" fill="#BAE6FD" stroke="#0B3A5B" stroke-width="3" />
      <path d="M 152 143 L 152 173 M 152 163 C 162 163, 168 153, 168 148" fill="none" stroke="#0B3A5B" stroke-width="3" stroke-linecap="round" />
      <circle cx="152" cy="146" r="5" fill="#0B3A5B" />
      <circle cx="152" cy="170" r="5" fill="#0B3A5B" />
      <circle cx="168" cy="148" r="5" fill="#0EA5E9" class="commit-dot" />

      <!-- Etiqueta (Texto 14px navy sobre celeste suave: 8.5:1) -->
      <rect x="105" y="206" width="110" height="30" rx="6" fill="#BAE6FD" stroke="#0B3A5B" stroke-width="2.5" />
      <text x="160" y="226" class="font-mono" font-size="14" font-weight="700" fill="#0B3A5B" text-anchor="middle">1. COMMIT</text>
      <text x="160" y="254" class="font-sans" font-size="14" font-weight="600" fill="#0369A1" text-anchor="middle">git push</text>
    </g>

    <!-- ==================== ETAPA 2: TESTS ==================== -->
    <g id="stage-tests">
      <rect x="350" y="118" width="120" height="78" rx="10" fill="#BAE6FD" stroke="#0B3A5B" stroke-width="3" />
      <!-- Barra superior oscura: texto blanco sobre navy (14:1) -->
      <path d="M 350 128 A 10 10 0 0 1 360 118 L 460 118 A 10 10 0 0 1 470 128 L 470 138 L 350 138 Z" fill="#0B3A5B" />
      <text x="410" y="133" class="font-mono" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">TEST SUITE</text>

      <!-- 3 Verificaciones -->
      <g transform="translate(366, 148)">
        <circle cx="10" cy="8" r="7" fill="#BAE6FD" stroke="#0B3A5B" stroke-width="1.5" class="test-chk-1" />
        <rect x="26" y="5" width="58" height="7" rx="3.5" fill="#0B3A5B" />
      </g>
      <g transform="translate(366, 165)">
        <circle cx="10" cy="8" r="7" fill="#BAE6FD" stroke="#0B3A5B" stroke-width="1.5" class="test-chk-2" />
        <rect x="26" y="5" width="46" height="7" rx="3.5" fill="#0B3A5B" />
      </g>

      <!-- Etiqueta (14px) -->
      <rect x="355" y="206" width="110" height="30" rx="6" fill="#BAE6FD" stroke="#0B3A5B" stroke-width="2.5" />
      <text x="410" y="226" class="font-mono" font-size="14" font-weight="700" fill="#0B3A5B" text-anchor="middle">2. TESTS</text>
      <text x="410" y="254" class="font-sans" font-size="14" font-weight="600" fill="#0369A1" text-anchor="middle">Unit &amp; E2E</text>
    </g>

    <!-- ==================== ETAPA 3: BUILD ==================== -->
    <g id="stage-build">
      <rect x="620" y="118" width="120" height="78" rx="10" fill="#BAE6FD" stroke="#0B3A5B" stroke-width="3" />
      <!-- Barra superior: texto blanco sobre navy -->
      <path d="M 620 128 A 10 10 0 0 1 630 118 L 730 118 A 10 10 0 0 1 740 128 L 740 138 L 620 138 Z" fill="#0B3A5B" />
      <text x="680" y="133" class="font-mono" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONTAINER</text>

      <!-- Grupo anidado: el padre fija la posición con translate, el hijo anima sin desfasarse -->
      <g transform="translate(658, 144)">
        <g class="build-box-inner">
          <rect x="0" y="0" width="44" height="38" rx="6" fill="#0B3A5B" stroke="#0EA5E9" stroke-width="2" />
          <line x1="0" y1="14" x2="44" y2="14" stroke="#7DD3FC" stroke-width="2" />
          <line x1="22" y1="14" x2="22" y2="38" stroke="#7DD3FC" stroke-width="2" />
          <rect x="16" y="5" width="12" height="5" rx="1.5" fill="#F97316" />
        </g>
      </g>

      <!-- Etiqueta (14px) -->
      <rect x="625" y="206" width="110" height="30" rx="6" fill="#BAE6FD" stroke="#0B3A5B" stroke-width="2.5" />
      <text x="680" y="226" class="font-mono" font-size="14" font-weight="700" fill="#0B3A5B" text-anchor="middle">3. BUILD</text>
      <text x="680" y="254" class="font-sans" font-size="14" font-weight="600" fill="#0369A1" text-anchor="middle">Image Sealed</text>
    </g>

    <!-- ==================== ETAPA 4: DEPLOY & CLUSTER ==================== -->
    <g id="stage-deploy">
      <rect x="880" y="102" width="280" height="114" rx="12" fill="#BAE6FD" stroke="#0B3A5B" stroke-width="3" />
      <path d="M 880 114 A 12 12 0 0 1 892 102 L 1148 102 A 12 12 0 0 1 1160 114 L 1160 124 L 880 124 Z" fill="#0B3A5B" />
      <text x="1020" y="119" class="font-mono" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">CLUSTER REPLICAS</text>

      <!-- Pod A: Live Actual (Texto blanco sobre navy: 14:1, badge navy sobre celeste: 8.5:1) -->
      <g transform="translate(896, 132)">
        <rect x="0" y="0" width="248" height="34" rx="6" fill="#0B3A5B" />
        <circle cx="16" cy="17" r="5" fill="#7DD3FC" />
        <text x="32" y="22" class="font-mono" font-size="14" font-weight="700" fill="#FFFFFF">POD A (CURRENT)</text>
        <rect x="182" y="6" width="56" height="22" rx="4" fill="#0EA5E9" />
        <text x="210" y="21" class="font-mono" font-size="11" font-weight="700" fill="#0B3A5B" text-anchor="middle">LIVE</text>
      </g>

      <!-- Pod B: Nueva Réplica (Translate en padre, animación en hijo: SOLUCIÓN DEL BUG) -->
      <g transform="translate(896, 172)">
        <g class="replica-inner">
          <rect x="0" y="0" width="248" height="34" rx="6" fill="#0B3A5B" stroke="#0EA5E9" stroke-width="2" />
          <circle cx="16" cy="17" r="5" fill="#FDBA74" class="replica-led" />
          <text x="32" y="22" class="font-mono" font-size="14" font-weight="700" fill="#FFFFFF">POD B (NEW)</text>
          <!-- Badge: Navy #0B3A5B sobre Naranja #F97316 (Contraste 6.8:1, pasa 4.5:1) -->
          <rect x="182" y="6" width="56" height="22" rx="4" fill="#F97316" />
          <text x="210" y="21" class="font-mono" font-size="11" font-weight="700" fill="#0B3A5B" text-anchor="middle">READY</text>
        </g>
      </g>

      <!-- Etiqueta DEPLOY (Texto navy sobre naranja suave: 6.8:1) -->
      <rect x="965" y="226" width="110" height="30" rx="6" fill="#FDBA74" stroke="#0B3A5B" stroke-width="2.5" />
      <text x="1020" y="246" class="font-mono" font-size="14" font-weight="700" fill="#0B3A5B" text-anchor="middle">4. DEPLOY</text>
      <text x="1020" y="272" class="font-sans" font-size="14" font-weight="600" fill="#C2410C" text-anchor="middle">Zero-Downtime</text>
    </g>

    <!-- ==================== EL PAQUETE EN MOVIMIENTO ==================== -->
    <g class="payload-runner">
      <rect x="-17" y="-17" width="34" height="34" rx="7" fill="#F97316" stroke="#0B3A5B" stroke-width="3" />
      <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#0B3A5B" />
      <path d="M -5 -3 L -2 0 L -5 3 M 5 -3 L 2 0 L 5 3" fill="none" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Firma en esquina inferior izquierda -->
    <text x="48" y="282" class="font-mono" font-size="12" font-weight="700" fill="#0369A1">BRIAN FLORES · CLOUD-NATIVE ARCHITECTURE</text>
  </g>
</svg>
