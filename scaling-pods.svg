<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="t d">
  <title id="t">Pods scaling up and down with load</title>
  <desc id="d">Animation: as the CPU load bar fills, new pods appear one by one until five replicas run, then the load drops and the pods scale back down.</desc>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .pod { transform-box: fill-box; transform-origin: center; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: load 10s ease-in-out infinite; }

    .p2 { animation: p2 10s infinite; }  .f2 { animation: f2 10s infinite; }
    .p3 { animation: p3 10s infinite; }  .f3 { animation: f3 10s infinite; }
    .p4 { animation: p4 10s infinite; }  .f4 { animation: f4 10s infinite; }
    .p5 { animation: p5 10s infinite; }  .f5 { animation: f5 10s infinite; }

    .r1 { animation: r1 10s infinite; }
    .r2 { animation: r2 10s infinite; }
    .r3 { animation: r3 10s infinite; }
    .r4 { animation: r4 10s infinite; }
    .r5 { animation: r5 10s infinite; }

    @keyframes load { 0%,10% { transform: scaleX(.2); } 62%,85% { transform: scaleX(1); } 95%,100% { transform: scaleX(.2); } }

    @keyframes p2 { 0%,14% { opacity: 0; transform: scale(.6); } 18% { opacity: 1; transform: scale(1); } 88% { opacity: 1; transform: scale(1); } 92%,100% { opacity: 0; transform: scale(.6); } }
    @keyframes p3 { 0%,29% { opacity: 0; transform: scale(.6); } 33% { opacity: 1; transform: scale(1); } 88% { opacity: 1; transform: scale(1); } 92%,100% { opacity: 0; transform: scale(.6); } }
    @keyframes p4 { 0%,44% { opacity: 0; transform: scale(.6); } 48% { opacity: 1; transform: scale(1); } 88% { opacity: 1; transform: scale(1); } 92%,100% { opacity: 0; transform: scale(.6); } }
    @keyframes p5 { 0%,59% { opacity: 0; transform: scale(.6); } 63% { opacity: 1; transform: scale(1); } 88% { opacity: 1; transform: scale(1); } 92%,100% { opacity: 0; transform: scale(.6); } }

    @keyframes f2 { 0%,14% { fill: #F97316; } 24%,100% { fill: #0EA5E9; } }
    @keyframes f3 { 0%,29% { fill: #F97316; } 39%,100% { fill: #0EA5E9; } }
    @keyframes f4 { 0%,44% { fill: #F97316; } 54%,100% { fill: #0EA5E9; } }
    @keyframes f5 { 0%,59% { fill: #F97316; } 69%,100% { fill: #0EA5E9; } }

    @keyframes r1 { 0%,14.9% { opacity: 1; } 15%,91.9% { opacity: 0; } 92%,100% { opacity: 1; } }
    @keyframes r2 { 0%,14.9% { opacity: 0; } 15%,29.9% { opacity: 1; } 30%,100% { opacity: 0; } }
    @keyframes r3 { 0%,29.9% { opacity: 0; } 30%,44.9% { opacity: 1; } 45%,100% { opacity: 0; } }
    @keyframes r4 { 0%,44.9% { opacity: 0; } 45%,59.9% { opacity: 1; } 60%,100% { opacity: 0; } }
    @keyframes r5 { 0%,59.9% { opacity: 0; } 60%,87.9% { opacity: 1; } 88%,100% { opacity: 0; } }
  </style>

  <rect width="1200" height="250" rx="20" fill="#E8F6FD"/>
  <rect x="0" y="0" width="1200" height="10" rx="5" fill="#0EA5E9"/>
  <rect x="900" y="0" width="300" height="10" rx="5" fill="#F97316"/>

  <text x="48" y="60" class="mono" font-size="20" font-weight="700" fill="#0B3A5B">deployment/order-service</text>
  <text x="48" y="86" class="sans" font-size="16" font-weight="500" fill="#0369A1">Horizontal Pod Autoscaler: more load, more replicas</text>

  <rect x="48" y="112" width="120" height="70" rx="14" fill="#0EA5E9"/>
  <text x="108" y="154" class="mono" font-size="18" font-weight="700" fill="#0B3A5B" text-anchor="middle">pod-1</text>

  <g class="pod p2">
    <rect class="f2" x="188" y="112" width="120" height="70" rx="14" fill="#F97316"/>
    <text x="248" y="154" class="mono" font-size="18" font-weight="700" fill="#0B3A5B" text-anchor="middle">pod-2</text>
  </g>
  <g class="pod p3">
    <rect class="f3" x="328" y="112" width="120" height="70" rx="14" fill="#F97316"/>
    <text x="388" y="154" class="mono" font-size="18" font-weight="700" fill="#0B3A5B" text-anchor="middle">pod-3</text>
  </g>
  <g class="pod p4">
    <rect class="f4" x="468" y="112" width="120" height="70" rx="14" fill="#F97316"/>
    <text x="528" y="154" class="mono" font-size="18" font-weight="700" fill="#0B3A5B" text-anchor="middle">pod-4</text>
  </g>
  <g class="pod p5">
    <rect class="f5" x="608" y="112" width="120" height="70" rx="14" fill="#F97316"/>
    <text x="668" y="154" class="mono" font-size="18" font-weight="700" fill="#0B3A5B" text-anchor="middle">pod-5</text>
  </g>

  <text x="800" y="124" class="sans" font-size="16" font-weight="600" fill="#0B3A5B">CPU load</text>
  <rect x="800" y="136" width="352" height="20" rx="10" fill="#BAE6FD"/>
  <rect class="bar" x="800" y="136" width="352" height="20" rx="10" fill="#F97316"/>

  <g class="mono" font-size="26" font-weight="700" fill="#0B3A5B">
    <text class="r1" x="800" y="204">replicas: 1</text>
    <text class="r2" x="800" y="204" opacity="0">replicas: 2</text>
    <text class="r3" x="800" y="204" opacity="0">replicas: 3</text>
    <text class="r4" x="800" y="204" opacity="0">replicas: 4</text>
    <text class="r5" x="800" y="204" opacity="0">replicas: 5</text>
  </g>

  <text x="48" y="226" class="mono" font-size="14" font-weight="500" fill="#0369A1">build → push → rollout</text>
</svg>
