<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Event-driven flow with partitions, a consumer and a dead-letter queue</title>
  <desc id="d">Animation: an order service publishes events into three partitions of a topic; a consumer reads them. One event fails, is retried with backoff, and ends in the dead-letter queue.</desc>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }

    .m0a { animation: move 4.5s linear infinite; animation-delay: 0s; }
    .m0b { animation: move 4.5s linear infinite; animation-delay: -2.25s; }
    .m1a { animation: move 4.5s linear infinite; animation-delay: -0.8s; }
    .m2a { animation: move 4.5s linear infinite; animation-delay: -1.5s; }
    .m2b { animation: move 4.5s linear infinite; animation-delay: -3.7s; }
    .fail { animation: fail 9s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 4.5s ease-in-out infinite; }

    @keyframes move {
      0%   { transform: translateX(0); opacity: 0; }
      6%   { opacity: 1; }
      94%  { opacity: 1; }
      100% { transform: translateX(670px); opacity: 0; }
    }
    @keyframes fail {
      0%   { transform: translate(0, 0); opacity: 0; }
      5%   { opacity: 1; }
      35%  { transform: translate(338px, 0); }
      40%  { transform: translate(318px, 0); }
      45%  { transform: translate(338px, 0); }
      50%  { transform: translate(318px, 0); }
      55%  { transform: translate(338px, 0); }
      65%  { transform: translate(338px, 91px); }
      85%  { transform: translate(560px, 91px); opacity: 1; }
      92%  { transform: translate(560px, 91px); opacity: 0; }
      100% { transform: translate(560px, 91px); opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.03); }
    }
  </style>

  <rect width="1200" height="300" rx="20" fill="#E8F6FD"/>
  <rect x="0" y="0" width="1200" height="10" rx="5" fill="#0EA5E9"/>
  <rect x="900" y="0" width="300" height="10" rx="5" fill="#F97316"/>

  <text x="48" y="56" class="mono" font-size="20" font-weight="700" fill="#0B3A5B">event: order.created</text>
  <text x="48" y="82" class="sans" font-size="16" font-weight="500" fill="#0369A1">Partitions, a consumer group, retries with backoff and a dead-letter queue</text>

  <rect x="48" y="118" width="190" height="114" rx="16" fill="#0B3A5B"/>
  <text x="143" y="170" class="mono" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">order-service</text>
  <text x="143" y="194" class="sans" font-size="14" font-weight="500" fill="#7DD3FC" text-anchor="middle">producer</text>

  <rect x="372" y="118" width="456" height="124" rx="16" fill="none" stroke="#0B3A5B" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="380" y="110" class="mono" font-size="15" font-weight="700" fill="#0B3A5B">topic: order.created</text>

  <rect x="250" y="128" width="698" height="28" rx="14" fill="#BAE6FD"/>
  <rect x="250" y="168" width="698" height="28" rx="14" fill="#BAE6FD"/>
  <rect x="250" y="208" width="698" height="28" rx="14" fill="#BAE6FD"/>
  <g class="mono" font-size="12" font-weight="700" fill="#0B3A5B">
    <text x="384" y="147">partition 0</text>
    <text x="384" y="187">partition 1</text>
    <text x="384" y="227">partition 2</text>
  </g>

  <rect x="250" y="262" width="578" height="24" rx="12" fill="#FDBA74"/>
  <text x="264" y="279" class="mono" font-size="13" font-weight="700" fill="#0B3A5B">order.created.dlq</text>
  <text x="840" y="279" class="sans" font-size="14" font-weight="500" fill="#0369A1">after retries with exponential backoff</text>

  <g>
    <circle class="m0a" cx="262" cy="142" r="9" fill="#F97316" stroke="#0B3A5B" stroke-width="2"/>
    <circle class="m0b" cx="262" cy="142" r="9" fill="#F97316" stroke="#0B3A5B" stroke-width="2"/>
    <circle class="m1a" cx="262" cy="182" r="9" fill="#F97316" stroke="#0B3A5B" stroke-width="2"/>
    <circle class="m2a" cx="262" cy="222" r="9" fill="#F97316" stroke="#0B3A5B" stroke-width="2"/>
    <circle class="m2b" cx="262" cy="222" r="9" fill="#F97316" stroke="#0B3A5B" stroke-width="2"/>
    <circle class="fail" cx="262" cy="182" r="11" fill="#0B3A5B" stroke="#C2410C" stroke-width="3"/>
  </g>

  <g class="pulse">
    <rect x="960" y="118" width="192" height="114" rx="16" fill="#FDBA74"/>
    <text x="1056" y="170" class="mono" font-size="16" font-weight="700" fill="#0B3A5B" text-anchor="middle">delivery-service</text>
    <text x="1056" y="194" class="sans" font-size="14" font-weight="500" fill="#7C2D12" text-anchor="middle">consumer group</text>
  </g>
</svg>
